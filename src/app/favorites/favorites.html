<div class="favorites-hero">
  <h1 class="favorites-title">Tus Pokémon Favoritos</h1>
  <p class="favorites-subtitle">Gestiona y visualiza todos los Pokémon que has marcado como favoritos.</p>
</div>

@if (favList().length > 0) {
  <!-- Grid de favoritos -->
  <div class="favorites-container">
    <div class="grid">
      @for (p of favList(); track p.id) {
        <app-pokemon-card [pokemon]="p" />
      }
    </div>
  </div>
} @else {
  <!-- Estado vacío -->
  <div class="empty-state-card">
    <span class="empty-state-icon">⭐</span>
    <h3 class="empty-state-title">Aún no tienes favoritos</h3>
    <p class="empty-state-text">¡Empieza a explorar y agrega tus Pokémon favoritos para verlos aquí!</p>
    <a routerLink="/home" class="btn-explore">Explorar Pokémon</a>
  </div>
}
